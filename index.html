<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emoji Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ff7a3d">
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#2b2438;--mute:#7a7388;--acc:#ff7a3d;--ok:#2fb36b;--line:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2e;--ink:#f3eefc;--mute:#9d95b0;--line:#352f45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141f;--card:#221e2e;--ink:#f3eefc;--mute:#9d95b0;--line:#352f45;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:26px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rank{font-weight:700}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s}
.quest{display:flex;align-items:center;gap:14px}
.quest .big{font-size:56px;line-height:1}
.quest p{margin:0;font-size:14px;color:var(--mute)}
.quest b{color:var(--ink);font-size:16px}
button{font:inherit;border:0;border-radius:10px;padding:9px 13px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--card);color:var(--mute);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.e{position:relative;aspect-ratio:1;font-size:30px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;padding:0;color:inherit}
.e.done{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok)}
.e.done::after{content:"✓";position:absolute;top:2px;right:5px;font-size:12px;color:var(--ok);font-weight:800}
.e.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.foot{text-align:center;margin:18px 0 8px}
.msg{min-height:20px;font-size:14px;color:var(--ok);font-weight:600;text-align:center;margin-bottom:8px}
</style>
</head>
<body>
<main>
  <h1><img src="favicon.svg" alt="" width="34" height="34" style="vertical-align:-7px;border-radius:8px"> Emoji Quest</h1>
  <p class="sub">Gebruik een emoji in een appje en tik hem hier aan. Verzamel ze allemaal!</p>

  <div class="card">
    <div class="row"><span class="rank" id="rank"></span><span id="count"></span></div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <div class="card quest">
    <div class="big" id="qe">🙂</div>
    <div>
      <b>Opdracht van vandaag</b>
      <p id="qt">Stuur deze emoji naar iemand.</p>
      <div class="btns"><button id="qcopy">Kopieer</button><button id="qdone">Gebruikt!</button><button class="ghost" id="qnew">Andere</button></div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="tabs" id="mode">
    <button data-m="check" class="on">Tik = afvinken</button>
    <button data-m="copy">Tik = kopiëren</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">Alles</button>
    <button data-f="todo">Nog te doen</button>
    <button data-f="done">Gebruikt</button>
  </div>
  <div class="grid" id="grid"></div>

  <div class="foot btns" style="justify-content:center">
    <button class="ghost" id="exp">Back-up opslaan</button>
    <button class="ghost" id="imp">Back-up laden</button>
    <button class="ghost" id="reset">Opnieuw beginnen</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
</main>

<script>
const ALL = "😀 😃 😄 😁 😆 😅 🤣 😂 🙂 🙃 🫠 😉 😊 😇 🥰 😍 🤩 😘 😗 ☺️ 😚 😙 🥲 😋 😛 😜 🤪 😝 🤑 🤗 🤭 🫢 🫣 🤫 🤔 🫡 🤐 🤨 😐 😑 😶 🫥 😏 😒 🙄 😬 🤥 😌 😔 😪 🤤 😴 😷 🤒 🤕 🤢 🤮 🤧 🥵 🥶 🥴 😵 🤯 🤠 🥳 🥸 😎 🤓 🧐 😕 🫤 😟 🙁 ☹️ 😮 😯 😲 😳 🥺 🥹 😦 😧 😨 😰 😥 😢 😭 😱 😖 😣 😞 😓 😩 😫 🥱 😤 😡 😠 🤬 😈 👿 💀 ☠️ 💩 🤡 👹 👺 👻 👽 👾 🤖 😺 😸 😹 😻 😼 😽 🙀 😿 😾".split(" ");
const RANKS = [[0,"Beginner"],[5,"Emoji-leerling"],[15,"Smiley-fan"],[30,"Gezichtenkenner"],[50,"Emoji-held"],[75,"Emoji-meester"],[100,"Legende"]];
let used = new Set(), filter = "all", quest = null, mode = "check";

function load(){
  try{
    const d = JSON.parse(localStorage.getItem("emojiquest")||"{}");
    used = new Set(d.used||[]);
    if(d.quest && d.quest.date===today()) quest = d.quest.e;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem("emojiquest", JSON.stringify({used:[...used], quest:{date:today(), e:quest}})); }catch(e){}
}
function today(){ return new Date().toISOString().slice(0,10); }
const $ = id => document.getElementById(id);

function newQuest(){
  const left = ALL.filter(e=>!used.has(e));
  if(!left.length){ quest=null; return; }
  let pick; do{ pick = left[Math.floor(Math.random()*left.length)]; }while(left.length>1 && pick===quest);
  quest = pick;
}
function toggle(e, el){
  let m = "";
  if(used.has(e)){ used.delete(e); }
  else{
    used.add(e);
    if(el){ el.classList.add("pop"); }
    const n = used.size;
    m = n===ALL.length ? "🏆 Alle emojis gebruikt! Je bent een legende!" : (n%10===0 ? `🎉 ${n} emojis verzameld!` : "");
    if(e===quest) newQuest();
  }
  $("msg").textContent = m;
  save(); render();
}
function render(){
  const n = used.size, t = ALL.length;
  $("count").textContent = `${n} / ${t}`;
  $("fill").style.width = (n/t*100)+"%";
  $("rank").textContent = "Rang: " + RANKS.filter(r=>n>=r[0]).pop()[1];
  if(quest && used.has(quest)) newQuest();
  $("qe").textContent = quest || "🏆";
  $("qt").textContent = quest ? "Gebruik deze emoji vandaag in een bericht." : "Alles verzameld, geweldig!";
  $("qdone").style.display = $("qnew").style.display = $("qcopy").style.display = quest ? "" : "none";
  const g = $("grid"); g.innerHTML = "";
  ALL.filter(e => filter==="all" || (filter==="done") === used.has(e)).forEach(e=>{
    const b = document.createElement("button");
    b.className = "e" + (used.has(e) ? " done" : "");
    b.textContent = e;
    b.onclick = () => mode==="copy" ? copy(e) : toggle(e, b);
    g.appendChild(b);
  });
}
async function copy(e){
  let ok = false;
  try{ await navigator.clipboard.writeText(e); ok = true; }catch(_){
    try{
      const t = document.createElement("textarea"); t.value = e; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select(); ok = document.execCommand("copy"); t.remove();
    }catch(_){}
  }
  $("msg").textContent = ok ? `Gekopieerd ${e} Plak hem in je app.` : "Kopiëren lukte niet.";
}
$("qcopy").onclick = () => quest && copy(quest);
$("mode").onclick = ev => {
  const m = ev.target.dataset.m; if(!m) return;
  mode = m;
  [...$("mode").children].forEach(b => b.classList.toggle("on", b.dataset.m===m));
};
$("qdone").onclick = () => quest && toggle(quest);
$("qnew").onclick = () => { newQuest(); save(); render(); };
$("reset").onclick = () => { if(confirm("Alles op nul zetten?")){ used = new Set(); newQuest(); $("msg").textContent=""; save(); render(); } };
$("tabs").onclick = ev => {
  const f = ev.target.dataset.f; if(!f) return;
  filter = f;
  [...$("tabs").children].forEach(b => b.classList.toggle("on", b.dataset.f===f));
  render();
};
$("exp").onclick = () => {
  const blob = new Blob([JSON.stringify({used:[...used]})], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "emoji-quest-backup.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("imp").onclick = () => $("file").click();
$("file").onchange = async ev => {
  const f = ev.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    used = new Set((d.used||[]).filter(e => ALL.includes(e)));
    newQuest(); save(); render(); $("msg").textContent = "Back-up geladen ✓";
  }catch(e){ $("msg").textContent = "Dat bestand kon ik niet lezen."; }
  ev.target.value = "";
};
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
load(); if(!quest) newQuest(); save(); render();
</script>
</body>
</html>
